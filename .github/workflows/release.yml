name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Criar release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""

  windows:
    needs: create-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Versão da tag
        shell: bash
        run: bash scripts/set-version.sh "$GITHUB_REF_NAME"
      - name: Testes
        run: cargo test --workspace --release
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Instalador
        shell: pwsh
        run: .\scripts\package-windows.ps1
      - name: Subir para a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" target/installer/*.exe --clobber

  linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Versão da tag
        run: bash scripts/set-version.sh "$GITHUB_REF_NAME"
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libx11-dev libxi-dev libxtst-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - name: Testes
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p lan-kvm
      - name: Pacote .deb
        run: bash scripts/package-deb.sh target/release/lan-kvm
      - name: Subir para a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" target/deb/*.deb --clobber

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Montar a tabela de downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-downloads.sh "$GITHUB_REF_NAME"
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
